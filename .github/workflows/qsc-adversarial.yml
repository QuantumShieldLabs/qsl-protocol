name: qsc-adversarial

on:
  pull_request: {}
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: qsc-adversarial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify-qsc-adversarial-scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        name: Classify pull request scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/classify_ci_scope.sh >> "$GITHUB_OUTPUT"

  adversarial-smoke:
    name: qsc-adversarial-smoke
    needs: classify
    if: github.event_name != 'pull_request' || needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            qsl/qsl-client/qsc/fuzz -> qsl/qsl-client/qsc/fuzz/target
      - name: Install cargo-fuzz
        shell: bash
        run: |
          set -euo pipefail
          # cargo-fuzz 0.13.1's BUNDLED Cargo.lock pins rustix 0.36.5, whose
          # rustc_layout_scalar_valid_range_* attributes current nightly rejects:
          # 4 errors in rustix-0.36.5/src/backend/linux_raw/io/errno.rs, exit 101.
          #
          # THE COMMENT THIS REPLACES WAS TRUE WHEN WRITTEN AND SILENTLY STOPPED
          # BEING TRUE. It read "Keep cargo-fuzz pinned while allowing compatible
          # dependency resolution on nightly" -- i.e. it relied on `cargo install`
          # WITHOUT `--locked` re-resolving past that pin. Current nightly cargo
          # honours a published Cargo.lock BY DEFAULT, so this step became a
          # --locked install with no edit on our side and went red on a push that
          # changed nothing about it. Measured 2026-09-22: the failing run's own
          # log resolves 0.13.1's bundled set exactly -- rustix 0.36.5, anyhow
          # 1.0.66, heck 0.4.0, clap_lex 0.3.0, ryu 1.0.15 -- with no --locked
          # passed. A default we do not control is not a pin.
          #
          # THE CURE IS THE VERSION, AND --locked IS NOW EXPLICIT so the step no
          # longer depends on which way that default happens to be set.
          # cargo-fuzz 0.13.2's bundled lock carries rustix 1.1.4.
          # Measured on the pinned nightly, scratch CARGO_HOME, both arms:
          #   0.13.1 --locked -> rustix 0.36.5, EXIT=101  (reproduces the runner)
          #   0.13.2 --locked -> rustix 1.1.4,  EXIT=0
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Run qsc adversarial smoke
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/qsc_adversarial.sh

  adversarial-miri:
    name: qsc-adversarial-miri
    needs: classify
    if: github.event_name != 'pull_request' || needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: miri
      - name: Run qsc adversarial miri
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly miri test --manifest-path qsl/qsl-client/qsc/Cargo.toml --test adversarial_miri -- --nocapture
